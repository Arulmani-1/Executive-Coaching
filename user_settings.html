<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | STACKLY Coaching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrapper">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="user_dashboard.html" class="text-decoration-none d-flex align-items-center gap-2">
          <img src="assets/logo/logo.webp" height="30" style="filter: invert(1);">
        </a>
      </div>
      <div class="sidebar-menu">
        <span class="eyebrow ms-3 mb-2" style="color: rgba(255,255,255,0.4);">CLIENT PORTAL</span>
        <a href="user_dashboard.html" class="sidebar-link "><i class="bi bi-house"></i> Home</a>
        <a href="user_sessions.html" class="sidebar-link "><i class="bi bi-calendar-check"></i> My Sessions</a>
        <a href="user_resources.html" class="sidebar-link "><i class="bi bi-folder2-open"></i> Resources</a>
        <a href="user_settings.html" class="sidebar-link active"><i class="bi bi-person-gear"></i> Profile</a>
      </div>
      <div class="sidebar-footer">
        <a href="login.html" class="sidebar-link"><i class="bi bi-box-arrow-left"></i> Log Out</a>
      </div>
    </div>
    
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-link text-dark d-lg-none p-0" id="sidebarToggle">
            <i class="bi bi-list fs-3"></i>
          </button>
          <h4 class="m-0 fs-5">Profile</h4>
        </div>
        <div class="d-flex align-items-center gap-4">
          
          <div class="d-flex align-items-center gap-2">
            <span id="displayEmail" class="fw-medium d-none d-sm-block" style="font-size: 0.9rem;">sarah.j@acmecorp.com</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        
<h4 class="mb-4">My Profile</h4>
<div class="row g-4">
  <div class="col-lg-8 order-1">
    <div class="dash-card mb-4 mb-lg-0">
      <h5 class="border-bottom pb-3 mb-4 text-dark">Personal Information</h5>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted small fw-medium">First Name</label>
            <input type="text" class="form-control bg-light" value="Sarah">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small fw-medium">Last Name</label>
            <input type="text" class="form-control bg-light" value="Jenkins">
          </div>
          <div class="col-12">
            <label class="form-label text-muted small fw-medium">Email Address</label>
            <input type="email" class="form-control bg-light" value="sarah.j@acmecorp.com">
          </div>
          <div class="col-12">
            <label class="form-label text-muted small fw-medium">Company</label>
            <input type="text" class="form-control bg-light" value="Acme Corp">
          </div>
          <div class="col-12 mt-4">
            <button type="button" class="btn btn-primary-custom py-2 px-4" onclick="window.location.href='404.html'">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  
  <div class="col-lg-4 order-2">
    <div class="dash-card h-100">
      <h5 class="border-bottom pb-3 mb-4 text-dark">Program Details</h5>
      <div class="mb-4">
        <span class="d-block text-muted small fw-medium mb-1">Current Program</span>
        <span class="d-block text-dark fw-bold">First 100 Days</span>
      </div>
      <div class="mb-4">
        <span class="d-block text-muted small fw-medium mb-1">Status</span>
        <span class="badge bg-success bg-opacity-10 text-success px-2 py-1 rounded-pill">Active Engagement</span>
      </div>
      <div class="mb-4">
        <span class="d-block text-muted small fw-medium mb-1">Primary Coach</span>
        <div class="d-flex align-items-center gap-2 mt-2">
          <img src="assets/images/team_1.webp" alt="Coach" class="rounded-circle" width="30" height="30">
          <span class="text-dark fw-medium">Staephan Humbert</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="col-lg-8 order-3">
    <div class="dash-card">
      <h5 class="border-bottom pb-3 mb-4 text-dark">Change Password</h5>
      <form>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label text-muted small fw-medium">Current Password</label>
            <input type="password" class="form-control bg-light" placeholder="••••••••">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small fw-medium">New Password</label>
            <input type="password" class="form-control bg-light" placeholder="New Password">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small fw-medium">Confirm Password</label>
            <input type="password" class="form-control bg-light" placeholder="Confirm Password">
          </div>
          <div class="col-12 mt-4">
            <button type="button" class="btn btn-outline-dark py-2 px-4" onclick="window.location.href='404.html'">Update Password</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

      </main>
    </div>
  </div>
  
  <script>
    document.getElementById('sidebarToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.add('show');
      document.getElementById('sidebarOverlay').classList.add('show');
      document.body.style.overflow = 'hidden'; // Stop background scrolling
      document.documentElement.style.overflow = 'hidden';
    });
    document.getElementById('sidebarOverlay').addEventListener('click', function() {
      document.getElementById('sidebar').classList.remove('show');
      this.classList.remove('show');
      document.body.style.overflow = ''; // Restore background scrolling
      document.documentElement.style.overflow = '';
    });
    document.getElementById('sidebarOverlay').addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>
  <script>
    const email = localStorage.getItem('userEmail');
    if (email) {
      document.getElementById('displayEmail').innerText = email;
    }
  </script>
</body>
</html>
