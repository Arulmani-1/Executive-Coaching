<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions | STACKLY Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrapper">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="admin_dashboard.html" class="text-decoration-none d-flex align-items-center gap-2">
          <img src="assets/logo/logo.webp" height="30" style="filter: invert(1);">
        </a>
      </div>
      <div class="sidebar-menu">
        <span class="eyebrow ms-3 mb-2" style="color: rgba(255,255,255,0.4);">ADMIN PANEL</span>
        <a href="admin_dashboard.html" class="sidebar-link "><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="admin_clients.html" class="sidebar-link "><i class="bi bi-people"></i> Clients</a>
        <a href="admin_sessions.html" class="sidebar-link active"><i class="bi bi-calendar-event"></i> Sessions</a>
        <a href="admin_settings.html" class="sidebar-link "><i class="bi bi-gear"></i> Settings</a>
      </div>
      <div class="sidebar-footer">
        <a href="login.html" class="sidebar-link"><i class="bi bi-box-arrow-left"></i> Log Out</a>
      </div>
    </div>
    
    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-link text-dark d-lg-none p-0" id="sidebarToggle">
            <i class="bi bi-list fs-3"></i>
          </button>
          <h4 class="m-0 fs-5">Sessions</h4>
        </div>
        <div class="d-flex align-items-center gap-4">
          
          <div class="d-flex align-items-center gap-2">
            <span id="displayEmail" class="fw-medium d-none d-sm-block" style="font-size: 0.9rem;">admin@stackly.com</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        
<div class="row mb-4 align-items-center">
  <div class="col">
    <h4 class="m-0">Upcoming Sessions</h4>
  </div>
  <div class="col-auto d-flex gap-2">
    <button class="btn btn-outline-dark py-2 px-3" onclick="window.location.href='404.html'"><i class="bi bi-calendar me-1"></i> Sync Calendar</button>
  </div>
</div>
<div class="row g-4">
  <div class="col-12">
    <div class="dash-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
      <div class="d-flex align-items-center gap-4">
        <div class="bg-light rounded p-3 text-center" style="min-width: 80px;">
          <span class="d-block text-danger fw-bold fs-5">AUG</span>
          <span class="d-block fs-3 fw-bold text-dark lh-1">15</span>
        </div>
        <div>
          <h5 class="mb-1 text-dark">Alignment Review & Next Steps</h5>
          <p class="text-muted mb-0"><i class="bi bi-clock me-1"></i> 10:00 AM - 11:00 AM (CST) &nbsp;&bull;&nbsp; <i class="bi bi-person me-1"></i> Sarah Jenkins</p>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" onclick="window.location.href='404.html'">Reschedule</button>
        <button class="btn btn-primary-custom" onclick="window.location.href='404.html'">Join Meeting</button>
      </div>
    </div>
  </div>
  <div class="col-12">
    <div class="dash-card d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
      <div class="d-flex align-items-center gap-4">
        <div class="bg-light rounded p-3 text-center" style="min-width: 80px;">
          <span class="d-block text-danger fw-bold fs-5">AUG</span>
          <span class="d-block fs-3 fw-bold text-dark lh-1">18</span>
        </div>
        <div>
          <h5 class="mb-1 text-dark">Discovery & Intro Call</h5>
          <p class="text-muted mb-0"><i class="bi bi-clock me-1"></i> 2:00 PM - 2:30 PM (CST) &nbsp;&bull;&nbsp; <i class="bi bi-person me-1"></i> Michael Ross</p>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" onclick="window.location.href='404.html'">Reschedule</button>
        <button class="btn btn-primary-custom" onclick="window.location.href='404.html'">Join Meeting</button>
      </div>
    </div>
  </div>
</div>

      </main>
    </div>
  </div>
  
  <script>
    document.getElementById('sidebarToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.add('show');
      document.getElementById('sidebarOverlay').classList.add('show');
      document.body.style.overflow = 'hidden'; // Stop background scrolling
      document.body.style.overflow = 'hidden';
    });
    document.getElementById('sidebarOverlay').addEventListener('click', function() {
      document.getElementById('sidebar').classList.remove('show');
      this.classList.remove('show');
      document.body.style.overflow = ''; // Restore background scrolling
      document.body.style.overflow = '';
    });
    document.getElementById('sidebarOverlay').addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>
  <script>
    const email = localStorage.getItem('userEmail');
    if (email) {
      document.getElementById('displayEmail').innerText = email;
    }
  </script>
</body>
</html>
